<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="wwtpBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="concreteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <pattern id="tankGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#38BDF8" stroke-width="0.5" stroke-opacity="0.15"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#wwtpBg)"/>
  <rect width="800" height="500" fill="url(#tankGrid)"/>

  <!-- Construction Title Header -->
  <text x="40" y="50" fill="#F97316" font-family="monospace" font-weight="bold" font-size="14" letter-spacing="2">PROJECT 01 // SALLAGHARI, BHAKTAPUR</text>
  <text x="40" y="80" fill="#F8FAFC" font-family="sans-serif" font-weight="bold" font-size="24">Wastewater Treatment Plant RCC Tank Complex</text>
  <text x="40" y="105" fill="#A7B0BD" font-family="sans-serif" font-size="13">Contractor: Sarathi Construction Pvt. Ltd. • Lead Site Engineer: Er. Denish Adhikari</text>

  <!-- Technical Tank Layout / Isometric Wireframe -->
  <g transform="translate(100, 140)">
    <!-- Aeration Tank 1 -->
    <polygon points="50,160 280,70 520,160 290,250" fill="#1E293B" stroke="#F97316" stroke-width="2" stroke-opacity="0.8"/>
    <polygon points="50,160 290,250 290,310 50,220" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.6"/>
    <polygon points="290,250 520,160 520,220 290,310" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.6"/>

    <!-- Inner Clarifier Chamber Walls -->
    <polygon points="120,160 280,105 450,160 290,215" fill="none" stroke="#F97316" stroke-width="1.5" stroke-dasharray="6 4"/>
    
    <!-- Water Level Shimmer -->
    <polygon points="65,168 280,88 505,168 290,248" fill="#0284C7" fill-opacity="0.25"/>

    <!-- Dimension & Alignment Indicators -->
    <line x1="50" y1="235" x2="290" y2="325" stroke="#F97316" stroke-width="1.5"/>
    <text x="160" y="295" fill="#F97316" font-family="monospace" font-size="11" font-weight="bold">SPAN = 24.50m (RCC RAFT)</text>

    <!-- Total Station Instrument Staking Ray -->
    <circle cx="580" cy="80" r="8" fill="#F97316"/>
    <line x1="580" y1="80" x2="520" y2="160" stroke="#F97316" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="580" y1="80" x2="280" y2="70" stroke="#F97316" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text x="595" y="75" fill="#F97316" font-family="monospace" font-size="10" font-weight="bold">TOTAL STATION STN-01</text>
    <text x="595" y="90" fill="#94A3B8" font-family="monospace" font-size="9">COORD: E 632810.4m, N 3065120.2m</text>

    <!-- Deep Foundation Piezometer / Water-bar Joint -->
    <rect x="230" y="240" width="120" height="25" rx="3" fill="#0B0F14" stroke="#F97316" stroke-width="1"/>
    <text x="240" y="256" fill="#F8FAFC" font-family="monospace" font-size="9">WATER-BAR SEAL // 250mm</text>
  </g>

  <!-- Technical Spec Callout Badge -->
  <g transform="translate(560, 360)">
    <rect width="200" height="90" rx="6" fill="#111827" stroke="#273244" stroke-width="1.5"/>
    <text x="15" y="25" fill="#F97316" font-family="monospace" font-size="11" font-weight="bold">CONCRETE SPECIFICATION</text>
    <text x="15" y="45" fill="#F8FAFC" font-family="sans-serif" font-size="11">Grade: M25 / M30 Waterproof</text>
    <text x="15" y="62" fill="#94A3B8" font-family="sans-serif" font-size="10">Slump Target: 100 ± 20mm</text>
    <text x="15" y="78" fill="#22C55E" font-family="monospace" font-size="10">QC: Cube Tested &amp; Approved</text>
  </g>
</svg>
